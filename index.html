<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="render()">
    <header>
      <img
        src="assets/icons/Capa_1.svg"
        alt="Fotogram Logo"
        class="Fotogram_logo"
      />
    </header>
    <main>
      <h1 class="main_title">Mein Persönliches Album</h1>
      <div id="galleri"></div>

      <dialog class="image_overlay" id="mydialog">
        <div class="overlay_box">
          <header class="overlay_header">
            <h2 id="dialog_titel"></h2>
            <div class="close_button" onclick="closeDialog()">
              <button class="btn_x">
                <img src="assets/icons/close.svg" alt="close_button" />
              </button>
            </div>
          </header>
          <section class="overlay_main"><img id="big_picture" /></section>
          <footer class="overlay_footer">
            <button onclick="lastImage()" class="btn_back">
              <img src="assets/icons/Arrow-Right.svg" alt="arrow_back" />
            </button>
            <span id="carousel-counter"></span>

            <button onclick="nextImage()" class="btn_next">
              <img src="assets/icons/Arrow-Right.svg" alt="arrow_next" />
            </button>
          </footer>
        </div>
      </dialog>
    </main>

    <footer>
      <div class="DevLogo_Box">
        <img
          src="assets/icons/Logo.svg"
          alt="DeveloperAkademi_Logo"
          class="DeveloperAkademi_Logo"
        />
      </div>
    </footer>
    <script src="script.js" defer></script>
  </body>
</html>
